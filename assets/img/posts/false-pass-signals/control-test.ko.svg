<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="대조군 검사: 같은 요청을 인증서 있이 한 번, 없이 한 번 보내 결과가 갈리는지 본다"><title>대조군 검사: 같은 요청을 인증서 있이 한 번, 없이 한 번 보내 결과가 갈리는지 본다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="269" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="360" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="middle">응답 하나만으로는 “인증서를 검사하고 준 답”과 “아예 안 보고 준 답”의 구분 불가</text><rect x="24" y="52" width="150" height="58" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="99" y="76.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">같은 요청</text><text x="99" y="93.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">+ 인증서</text><rect x="24" y="140" width="150" height="58" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="99" y="164.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">같은 요청</text><text x="99" y="181.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">인증서 미첨부</text><rect x="270" y="80" width="150" height="90" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="345" y="130.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#1e2430" font-weight="700" text-anchor="middle">푸시 서버</text><line x1="176" y1="81" x2="266" y2="110" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="176" y1="169" x2="266" y2="140" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="500" y="52" width="196" height="58" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="598" y="76.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">앱 단계까지 들어가</text><text x="598" y="93.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">“인증 정보 없음” 응답</text><rect x="500" y="140" width="196" height="58" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="598" y="164.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">연결 단계에서</text><text x="598" y="181.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">아예 거절</text><line x1="422" y1="110" x2="496" y2="81" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="422" y1="140" x2="496" y2="169" stroke="#b7352c" stroke-width="1.6" marker-end="url(#a-seal)"/><rect x="24" y="218" width="672" height="36" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="360" y="241.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#276843" font-weight="600" text-anchor="middle">두 결과의 분리 → 서버의 실제 인증서 검사 = 통과 입증</text></svg>
