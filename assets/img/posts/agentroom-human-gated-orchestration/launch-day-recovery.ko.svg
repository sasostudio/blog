<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="출시 당일 복구 흐름: 증발한 dev를 총괄이 디스크 확인으로 잡아냈다"><title>출시 당일 복구 흐름: 증발한 dev를 총괄이 디스크 확인으로 잡아냈다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="219" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="40" width="124" height="72" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="86.0" y="72.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">dev 호출</text><text x="86.0" y="88.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">소리 없이 증발</text><rect x="161" y="40" width="124" height="72" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="223.0" y="72.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">총괄이 디스크 확인</text><text x="223.0" y="88.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">→ 파일 없음</text><line x1="150" y1="76.0" x2="159" y2="76.0" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="298" y="40" width="124" height="72" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="360.0" y="72.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">유실로 판정</text><text x="360.0" y="88.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">→ dev 재호출</text><line x1="287" y1="76.0" x2="296" y2="76.0" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="435" y="40" width="124" height="72" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="497.0" y="72.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">qa가 실제 파일을</text><text x="497.0" y="88.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">읽고 승인</text><line x1="424" y1="76.0" x2="433" y2="76.0" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="572" y="40" width="124" height="72" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="634.0" y="72.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">관리자에겐</text><text x="634.0" y="88.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">transcript 한 줄</text><line x1="561" y1="76.0" x2="570" y2="76.0" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="360" y="156.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="600" text-anchor="middle">실패가 거짓 “완료”가 아니라 기록으로 도착했다</text><text x="360" y="186.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="middle">근본 원인(백그라운드 호출)은 그날 고침 → 동기 호출 의무화</text></svg>
