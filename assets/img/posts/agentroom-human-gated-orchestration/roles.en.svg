<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-label="AgentRoom roles: a director moves between three agents and asks the human before anything hard to undo"><title>AgentRoom roles: a director moves between three agents and asks the human before anything hard to undo</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="349" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="290" y="18" width="140" height="42" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="360" y="45.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14.5" fill="#1e2430" font-weight="700" text-anchor="middle">Human</text><rect x="230" y="100" width="260" height="56" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="360.0" y="124.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14.5" fill="#1e2430" font-weight="600" text-anchor="middle">Director</text><text x="360.0" y="145.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#49505e" font-weight="400" text-anchor="middle">one Claude Code session</text><line x1="360" y1="98" x2="360" y2="64" stroke