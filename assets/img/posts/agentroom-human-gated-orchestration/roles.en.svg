chor="middle">qa</text><text x="598" y="258.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="500" text-anchor="middle">review · read-only</text><text x="598" y="274.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="500" text-anchor="middle">no Write/Edit tools</text><line x1="300" y1="158" x2="140" y2="210" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="360" y1="158" x2="360" y2="210" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="420" y1="158" x2="590" y2="210" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="460" y1="254" x2="498" y2="254" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><text x="479" y="310.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">“done” goes through qa</text><text x="360" y="336.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="middle">Evidence is the real file on disk — dev's claim is only a lead</text></svg>
