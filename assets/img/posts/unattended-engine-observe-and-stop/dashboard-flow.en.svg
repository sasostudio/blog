<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img" aria-label="Dashboard structure: the engine only writes records; the screens only read them"><title>Dashboard structure: the engine only writes records; the screens only read them</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="249" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="80" width="176" height="80" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="112" y="104.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">Engine</text><text x="112" y="120.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">writes records</text><text x="112" y="137.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">(events · heartbeat · state)</text><rect x="240" y="20" width="160" height="70" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="320" y="44.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">PC dashboard</text><text x="320" y="60.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">reads records directly</text><text x="320" y="77.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">zero AI calls</text><line x1="202" y1="106" x2="236" y2="60" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="240" y="140" width="150" height="74" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="315" y="164.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">Uploader</text><text x="315" y="180.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">pushes changes only</text><text x="315" y="197.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">auto-starts, no window</text><line x1="202" y1="134" x2="236" y2="172" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="410" y="140" width="156" height="74" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="488" y="164.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">Database</text><text x="488" y="180.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">refuses without login</text><text x="488" y="197.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">auto-deletes after 7 days</text><line x1="392" y1="177" x2="406" y2="177" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="584" y="140" width="112" height="74" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="640" y="166.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">Site (login)</text><text x="640" y="182.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">on a phone too</text><line x1="568" y1="177" x2="580" y2="177" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><text x="560" y="238.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">reaches the cloud DB in 2–5 s</text></svg>
