<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="사용량 정지: 다음 호출 전 정지는 긴 호출 앞에서 무의미"><title>사용량 정지: 다음 호출 전 정지는 긴 호출 앞에서 무의미</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="279" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="40" width="560" height="30" rx="4" fill="#ebe4d1" stroke="#b3a78b"/><text x="162" y="60.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="middle">작업자 호출 1번 (항목 9개 · 25분 이상)</text><line x1="300" y1="30" x2="300" y2="80" stroke="#b7352c" stroke-width="2" stroke-dasharray="4 3"/><text x="300" y="26.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="700" text-anchor="middle">기준 97%</text><rect x="300" y="40" width="284" height="30" fill="#f6e4dc" opacity="0.8"/><text x="442" y="60.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="700" text-anchor="middle">기준 초과</text><text x="24" y="104.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="start">수정 전: 「다음 호출 전 정지」 표시만 → 이 호출은 끝까지 진행 → 결국 정지 실패</text><text x="24" y="128.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="start">수정 후: 기준 도달 즉시 차단 → 세션 유지 → 재개 시 같은 세션으로 이어 감</text><rect x="24" y="150" width="330" height="64" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="189" y="174.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">부모만 종료(Popen.kill)</text><text x="189" y="190.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">자식 CLI 생존·파이프 점유 → 정지 60초 지연</text><rect x="366" y="150" width="330" height="64" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="531" y="174.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">프로세스 트리 전체 차단</text><text x="531" y="190.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">taskkill /T</text><text x="360" y="252.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="12" fill="#6b655a" font-weight="600" text-anchor="middle">5h 95% · 7d 97%</text></svg>
