<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-label="코드 한 줄 전에 통과해야 하는 7개 질문 — 하나라도 걸리면 시작하지 않는다"><title>코드 한 줄 전에 통과해야 하는 7개 질문 — 하나라도 걸리면 시작하지 않는다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="379" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="24" width="520" height="34" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="46.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="500" text-anchor="start">1  이 문제 때문에 지난주에 실제로 불편했는가?</text><rect x="556" y="24" width="140" height="34" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.2"/><text x="626" y="46.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">아니오 → 착수 금지</text><rect x="24" y="66" width="520" height="34" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="88.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="500" text-anchor="start">2  메모장·엑셀·기존 앱으로 대체 가능한가?</text><rect x="556" y="66" width="140" height="34" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.2"/><text x="626" y="88.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">예 → 착수 금지</text><rect x="24" y="108" width="520" height="34" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="130.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="500" text-anchor="start">3  하루 1회 이상 자연스럽게 열게 되는 트리거가 있는가?</text><rect x="556" y="108" width="140" height="34" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.2"/><text x="626" y="130.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">아니오 → 착수 금지</text><rect x="24" y="150" width="520" height="34" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="172.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="500" text-anchor="start">4  핵심 동기가 진짜인가?</text><rect x="556" y="150" width="140" height="34" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.2"/><text x="626" y="172.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">아니오 → 착수 금지</text><rect x="24" y="192" width="520" height="34" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="214.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="500" text-anchor="start">5  매일 바뀌는 변수가 있는가?</text><rect x="556" y="192" width="140" height="34" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.2"/><text x="626" y="214.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">아니오 → 착수 금지</text><rect x="24" y="234" width="520" height="34" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="256.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="500" text-anchor="start">6  핵심 재료(외부 API·데이터)가 실존하는가?</text><rect x="556" y="234" width="140" height="34" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.2"/><text x="626" y="256.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">아니오 → 착수 금지</text><rect x="24" y="276" width="520" height="34" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="298.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="500" text-anchor="start">7  유통 채널이 실제로 열려 있는가?</text><rect x="556" y="276" width="140" height="34" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.2"/><text x="626" y="298.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">아니오 → 착수 금지</text><line x1="284" y1="320" x2="284" y2="336" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><rect x="24" y="338" width="520" height="32" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="284" y="359.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#276843" font-weight="700" text-anchor="middle">일곱 개 전부 통과 시에만 코드 작성</text></svg>
