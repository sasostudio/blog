<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The test runner's false pass and the guard that flips skipped files into a failure"><title>The test runner's false pass and the guard that flips skipped files into a failure</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="40" width="170" height="70" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="109" y="68.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#1e2430" font-weight="600" text-anchor="middle">Test file</text><text x="109" y="86.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#1e2430" font-weight="600" text-anchor="middle">fails to parse</text><line x1="196" y1="75" x2="240" y2="75" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="244" y="40" width="200" height="70" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="344" y="68.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#1e2430" font-weight="500" text-anchor="middle">GUT warns and</text><text x="344" y="86.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#1e2430" font-weight="500" text-anchor="middle">skips that file</text><line x1="446" y1="75" x2="490" y2="75" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="494" y="40" width="202" height="70" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="595" y="68.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#b7352c" font-weight="600" text-anchor="middle">“All tests passed”</text><text x="595" y="86.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#b7352c" font-weight="600" text-anchor="middle">exit code 0</text><g transform="rotate(-2.5 640 130)"><rect x="595.2" y="118.5" width="89.60000000000001" height="20.125" rx="3" fill="none" stroke="#b7352c" stroke-width="1.4"/><text x="640" y="133.2" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="11.5" fill="#b7352c" font-weight="700" text-anchor="middle">FALSE PASS</text></g><line x1="595" y1="112" x2="595" y2="168" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="244" y="172" width="452" height="80" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="260" y="196.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#1e2430" font-weight="600" text-anchor="start">A wrapper script scans the output for</text><text x="260" y="222.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="12.5" fill="#49505e" font-weight="500" text-anchor="start">Ignoring script  ·  SCRIPT ERROR  ·  Parse Error</text><line x1="242" y1="212" x2="198" y2="212" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><rect x="24" y="172" width="170" height="80" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="109" y="202.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#276843" font-weight="600" text-anchor="middle">Any match</text><text x="109" y="220.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#276843" font-weight="600" text-anchor="middle">→ force exit code 1</text><g transform="rotate(-2.5 109 274)"><rect x="78.92" y="262.5" width="60.160000000000004" height="20.125" rx="3" fill="none" stroke="#276843" stroke-width="1.4"/><text x="109" y="277.2" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="11.5" fill="#276843" font-weight="700" text-anchor="middle">CAUGHT</text></g><text x="460" y="282.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#6b655a" font-weight="500" text-anchor="middle">During the evaluation this guard fired for real at least three times</text></svg>
