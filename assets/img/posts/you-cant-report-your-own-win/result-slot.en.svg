<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="Finalizing a result: both devices' conclusions collapse into one shared result slot"><title>Finalizing a result: both devices' conclusions collapse into one shared result slot</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="329" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="34" width="170" height="96" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="58.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#1e2430" font-weight="600" text-anchor="start">Device A</text><text x="38" y="80.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="400" text-anchor="start">Board filled up</text><text x="38" y="97.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="400" text-anchor="start">→ reports own loss</text><rect x="24" y="186" width="170" height="96" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="210.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#1e2430" font-weight="600" text-anchor="start">Device B</text><text x="38" y="232.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="400" text-anchor="start">Almost the same instant</text><text x="38" y="249.8" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="400" text-anchor="start">judges a timeout</text><rect x="330" y="80" width="150" height="150" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="405.0" y="104.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#b7352c" font-weight="600" text-anchor="middle">Shared result</text><text x="405.0" y="124.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#b7352c" font-weight="600" text-anchor="middle">slot</text><text x="405.0" y="146.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="400" text-anchor="middle">(server)</text><g transform="rotate(-2.5 405 205)"><rect x="338.12" y="193.5" width="133.76" height="20.125" rx="3" fill="none" stroke="#b7352c" stroke-width="1.4"/><text x="405" y="208.2" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="11.5" fill="#b7352c" font-weight="700" text-anchor="middle">FIRST WRITE WINS</text></g><line x1="196" y1="82" x2="326" y2="128" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="261" y="74.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="500" text-anchor="middle">① arrives first</text><text x="261" y="90.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="500" text-anchor="middle">→ recorded</text><line x1="196" y1="234" x2="326" y2="188" stroke="#6b655a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-faint)"/><text x="261" y="236.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="middle">② arrives late</text><text x="261" y="252.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="middle">→ drops its verdict</text><rect x="526" y="50" width="170" height="52" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="540" y="74.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14.5" fill="#1e2430" font-weight="600" text-anchor="start">A's screen: loss</text><rect x="526" y="208" width="170" height="52" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="540" y="232.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14.5" fill="#1e2430" font-weight="600" text-anchor="start">B's screen: win</text><line x1="482" y1="130" x2="522" y2="82" stroke="#b7352c" stroke-width="1.6" marker-end="url(#a-seal)"/><line x1="482" y1="180" x2="522" y2="228" stroke="#b7352c" stroke-width="1.6" marker-end="url(#a-seal)"/><text x="611" y="152.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">both read the</text><text x="611" y="168.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">same record</text><text x="360" y="314.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">✕  Nobody can send “I won” — a win is derived from the other side's reported loss</text></svg>
