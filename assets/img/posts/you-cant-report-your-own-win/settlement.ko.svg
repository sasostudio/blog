<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="트로피 정산 전후: 마커와 보상을 다른 저장소에 두면 두 가지 실패가 열린다"><title>트로피 정산 전후: 마커와 보상을 다른 저장소에 두면 두 가지 실패가 열린다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="359" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="24" y="34.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#b7352c" font-weight="700" text-anchor="start">전 — 저장소 2곳</text><rect x="24" y="50" width="160" height="62" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="38" y="74.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#1e2430" font-weight="600" text-anchor="start">실시간 DB</text><text x="38" y="94.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="400" text-anchor="start">정산 마커</text><rect x="192" y="50" width="160" height="62" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="206" y="74.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#1e2430" font-weight="600" text-anchor="start">문서 DB</text><text x="206" y="94.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="400" text-anchor="start">트로피 변경</text><text x="188" y="138.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">✕ 두 쓰기 사이의 함수 종료 시</text><line x1="104" y1="150" x2="104" y2="176" stroke="#b7352c" stroke-width="1.6" marker-end="url(#a-seal)"/><line x1="272" y1="150" x2="272" y2="176" stroke="#b7352c" stroke-width="1.6" marker-end="url(#a-seal)"/><rect x="24" y="180" width="160" height="92" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="104" y="204.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">마커만 잔존</text><text x="104" y="220.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">재시도가 “처리됨”으로</text><text x="104" y="236.4" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">걸러져 영영 미지급</text><rect x="192" y="180" width="160" height="92" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="272" y="204.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">트로피만 반영</text><text x="272" y="220.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">재시도마다</text><text x="272" y="236.4" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="500" text-anchor="middle">중복 지급</text><line x1="368" y1="24" x2="368" y2="336" stroke="#d9d0bb" stroke-width="1.2"/><text x="392" y="34.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="15" fill="#276843" font-weight="700" text-anchor="start">후 — 트랜잭션 1개</text><rect x="392" y="50" width="304" height="236" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="406" y="74.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#276843" font-weight="600" text-anchor="start">문서 DB · 하나의 트랜잭션</text><rect x="408" y="84" width="272" height="36" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="422" y="107.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="600" text-anchor="start">1  정산 원장부터 조회</text><line x1="461" y1="122" x2="461" y2="140" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="602" y1="122" x2="602" y2="140" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="408" y="144" width="106" height="66" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="461" y="166.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#49505e" font-weight="500" text-anchor="middle">원장 존재</text><text x="461" y="182.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#49505e" font-weight="500" text-anchor="middle">→ 처리 생략</text><rect x="522" y="144" width="160" height="66" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="532" y="166.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="start">원장 부재</text><text x="532" y="182.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="start">→ 트로피 A·B + 원장</text><text x="532" y="198.4" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#1e2430" font-weight="600" text-anchor="start">    일괄 커밋</text><text x="544" y="234.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="500" text-anchor="middle">같은 트랜잭션 안에서</text><text x="544" y="250.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="500" text-anchor="middle">두 참가자의 입장 흔적·역할도 확인</text><text x="544" y="316.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#276843" font-weight="600" text-anchor="middle">재시도해도 원장이 있으니 조용히 종료</text></svg>
