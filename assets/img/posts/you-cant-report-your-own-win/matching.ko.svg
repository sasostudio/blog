<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="자동 매칭 순서: 두 ID 중 작은 쪽이 방을 만든다"><title>자동 매칭 순서: 두 ID 중 작은 쪽이 방을 만든다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="399" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="45" y="20" width="170" height="54" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="130.0" y="44.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14.5" fill="#1e2430" font-weight="600" text-anchor="middle">플레이어 A</text><text x="130.0" y="65.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#49505e" font-weight="400" text-anchor="middle">ID가 작음</text><line x1="130" y1="76" x2="130" y2="330" stroke="#b3a78b" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="275" y="20" width="170" height="54" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="360.0" y="44.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14.5" fill="#1e2430" font-weight="600" text-anchor="middle">대기열</text><text x="360.0" y="65.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#49505e" font-weight="400" text-anchor="middle">실시간 DB</text><line x1="360" y1="76" x2="360" y2="330" stroke="#b3a78b" stroke-width="1.2" stroke-dasharray="3 4"/><rect x="505" y="20" width="170" height="54" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="590.0" y="44.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14.5" fill="#1e2430" font-weight="600" text-anchor="middle">플레이어 B</text><text x="590.0" y="65.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#49505e" font-weight="400" text-anchor="middle">ID가 큼</text><line x1="590" y1="76" x2="590" y2="330" stroke="#b3a78b" stroke-width="1.2" stroke-dasharray="3 4"/><text x="360" y="104.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#6b655a" font-weight="500" text-anchor="middle">① 거의 동시에 서로를 발견 — 발견 순서는 무관</text><rect x="45" y="120" width="170" height="52" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="130" y="142.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="600" text-anchor="middle">② 작은 ID = 나</text><text x="130" y="159.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="600" text-anchor="middle">→ 방 생성</text><rect x="505" y="120" width="170" height="52" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="590" y="142.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="500" text-anchor="middle">② 작은 ID ≠ 나</text><text x="590" y="159.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#49505e" font-weight="500" text-anchor="middle">→ 대기</text><line x1="132" y1="206" x2="356" y2="206" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="244.0" y="198.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#6b655a" font-weight="500" text-anchor="middle">③ 내 항목에 방 번호 기록</text><line x1="362" y1="250" x2="586" y2="250" stroke="#6b655a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a-faint)"/><text x="474.0" y="242.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#6b655a" font-weight="500" text-anchor="middle">④ A의 항목에서 방 번호 확인</text><line x1="588" y1="294" x2="364" y2="294" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="476.0" y="286.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#6b655a" font-weight="500" text-anchor="middle">⑤ 방에 입장 · 입장 흔적 기록</text><rect x="24" y="340" width="672" height="46" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="360" y="368.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="500" text-anchor="middle">쓰기 권한은 자기 항목 한정 — 남의 항목은 읽기 전용. 규칙이 쌍마다 하나의 답을 내므로 경합 여지 0</text></svg>
