<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="Versus structure: the state machine doesn't know whether the opponent is a bot or a person; the swap point is one Opponent contract"><title>Versus structure: the state machine doesn't know whether the opponent is a bot or a person; the swap point is one Opponent contract</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="319" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="300" y="20" width="396" height="52" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="318" y="42.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="13.5" fill="#1e2430" font-weight="700" text-anchor="start">matchController</text><text x="318" y="61.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">top-level state machine — opponent-agnostic</text><line x1="498" y1="74" x2="498" y2="96" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="300" y="98" width="396" height="52" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="318" y="120.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#1e2430" font-weight="700" text-anchor="start">Opponent contract</text><text x="318" y="139.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">attack events · snapshots · fx</text><line x1="400" y1="152" x2="400" y2="176" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="596" y1="152" x2="596" y2="176" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="300" y="178" width="190" height="70" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="314" y="200.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="13" fill="#1e2430" font-weight="700" text-anchor="start">botOpponent</text><text x="314" y="220.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">actually runs a second</text><text x="314" y="235.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">physics board</text><rect x="498" y="170" width="206" height="86" rx="8" fill="none" stroke="#b7352c" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="506" y="178" width="190" height="70" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="520" y="200.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="13" fill="#1e2430" font-weight="700" text-anchor="start">remoteOpponent</text><text x="520" y="220.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">runs no physics</text><text x="520" y="235.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="start">re-renders received snapshots</text><rect x="24" y="98" width="250" height="150" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="40" y="124.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#276843" font-weight="700" text-anchor="start">One engine</text><text x="40" y="150.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#276843" font-weight="500" text-anchor="start">combatant.ts wraps createGame()</text><text x="40" y="167.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#276843" font-weight="500" text-anchor="start">and adds only versus overrides</text><text x="40" y="184.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#276843" font-weight="500" text-anchor="start">layout · forcedZone · logicalSize</text><text x="360" y="290.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="600" text-anchor="middle">versus/net/ — an isolation layer: reach into game logic from here and the swap point collapses</text></svg>
