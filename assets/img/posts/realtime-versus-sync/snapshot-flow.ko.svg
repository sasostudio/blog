<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="스냅샷 흐름: 엔진을 고치지 않고 읽어서 보내고, 받는 쪽은 봇전과 같은 함수로 다시 그린다"><title>스냅샷 흐름: 엔진을 고치지 않고 읽어서 보내고, 받는 쪽은 봇전과 같은 함수로 다시 그린다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="199" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="30" width="128" height="96" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="88.0" y="60.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="700" text-anchor="middle">내 보드</text><text x="88.0" y="81.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="middle">엔진의 위치값을</text><text x="88.0" y="96.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="middle">읽기만 하는 탭</text><rect x="168" y="30" width="128" height="96" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="232.0" y="60.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="700" text-anchor="middle">양자화 · 델타</text><text x="232.0" y="81.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="middle">멈춘 오브젝트는</text><text x="232.0" y="96.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#49505e" font-weight="500" text-anchor="middle">자동으로 제외</text><line x1="154" y1="78" x2="166" y2="78" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="312" y="30" width="104" height="96" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="364.0" y="78.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="700" text-anchor="middle">15Hz 송신</text><line x1="298" y1="78" x2="310" y2="78" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="432" y="30" width="104" height="96" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="484.0" y="78.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#1e2430" font-weight="700" text-anchor="middle">RTDB 중계</text><line x1="418" y1="78" x2="430" y2="78" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="552" y="30" width="144" height="96" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="624.0" y="60.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13" fill="#276843" font-weight="700" text-anchor="middle">상대 화면</text><text x="624.0" y="81.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#276843" font-weight="500" text-anchor="middle">봇전과 같은</text><text x="624.0" y="96.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#276843" font-weight="500" text-anchor="middle">그리기 함수로 재렌더</text><line x1="538" y1="78" x2="550" y2="78" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="360" y="168.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="middle">송신용 훅을 엔진에 뚫지 않았으므로, 통신이 붙어도 싱글 플레이 경로는 불변</text></svg>
