<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" role="img" aria-label="The track-switch fade: from a timer to the moment playback actually starts"><title>The track-switch fade: from a timer to the moment playback actually starts</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="269" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="24" y="74.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#b7352c" font-weight="700" text-anchor="start">Before</text><line x1="130" y1="110" x2="696" y2="110" stroke="#b3a78b"/><text x="696" y="128.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#6b655a" font-weight="500" text-anchor="end">time →</text><polygon points="130,50 240,50 300,80 130,80" fill="#ebe4d1" stroke="#b3a78b"/><text x="180" y="70.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#1e2430" font-weight="600" text-anchor="middle">old track</text><text x="270" y="46.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#6b655a" font-weight="600" text-anchor="middle">fade</text><rect x="300" y="50" width="170" height="30" fill="#f6e4dc" stroke="#b7352c" stroke-dasharray="4 3"/><text x="385" y="70.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="700" text-anchor="middle">silence</text><text x="385" y="98.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#6b655a" font-weight="600" text-anchor="middle">waiting for data</text><rect x="470" y="50" width="226" height="30" fill="#e3eee5" stroke="#b3a78b"/><text x="583" y="70.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#1e2430" font-weight="600" text-anchor="middle">new track</text><line x1="470" y1="44" x2="470" y2="110" stroke="#b7352c" stroke-width="1.5"/><text x="470" y="124.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#b7352c" font-weight="600" text-anchor="middle">playback starts</text><text x="24" y="184.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#276843" font-weight="700" text-anchor="start">After</text><line x1="130" y1="220" x2="696" y2="220" stroke="#b3a78b"/><text x="696" y="238.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#6b655a" font-weight="500" text-anchor="end">time →</text><rect x="130" y="160" width="340" height="30" fill="#ebe4d1" stroke="#b3a78b"/><text x="300" y="180.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#1e2430" font-weight="600" text-anchor="middle">old track — old track kept while waiting</text><polygon points="470,160 530,190 696,190 696,160" fill="#e3eee5" stroke="#276843"/><text x="610" y="180.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#276843" font-weight="700" text-anchor="middle">new track</text><line x1="470" y1="154" x2="470" y2="220" stroke="#276843" stroke-width="1.5"/><text x="470" y="234.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="10.5" fill="#276843" font-weight="600" text-anchor="middle">playback starts → fade</text></svg>
