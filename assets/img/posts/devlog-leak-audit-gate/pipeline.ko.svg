<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="devlog 게시 흐름: 넘치게 뽑고, 사람이 고르고, 유출은 있다고 가정한 감사를 통과해야 게시된다"><title>devlog 게시 흐름: 넘치게 뽑고, 사람이 고르고, 유출은 있다고 가정한 감사를 통과해야 게시된다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="40" width="150" height="66" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="99" y="66.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">작업로그 버퍼</text><text x="99" y="84.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">월별 · 두세 줄씩</text><rect x="204" y="40" width="150" height="66" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="279" y="66.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">글감 메뉴 표</text><text x="279" y="84.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">깊이 · 민감도</text><rect x="384" y="40" width="110" height="66" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="439" y="66.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">조립</text><text x="439" y="84.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">초안</text><rect x="524" y="32" width="172" height="82" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="610" y="56.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">독립 감사</text><text x="610" y="73.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">유출은 있다고 가정</text><text x="610" y="91.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">읽기 전용</text><line x1="176" y1="73" x2="200" y2="73" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="356" y1="73" x2="380" y2="73" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="368" y="128.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="600" text-anchor="middle">관리자가 고른 것만</text><line x1="496" y1="73" x2="520" y2="73" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><path d="M560 116 Q 560 148 480 148 Q 439 148 439 112" fill="none" stroke="#b7352c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-seal)"/><text x="400" y="168.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="600" text-anchor="middle">플래그 → 본체가 수정 → 재감사</text><line x1="640" y1="116" x2="640" y2="186" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="466" y="190" width="230" height="60" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="581" y="214.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">감사 결과(PASS · 플래그)를</text><text x="581" y="231.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">관리자에게 함께 보여줌</text><rect x="320" y="190" width="120" height="60" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="380" y="214.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">관리자 “올려”</text><text x="380" y="231.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">→ 게시</text><line x1="464" y1="220" x2="444" y2="220" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><text x="24" y="282.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="start">처리한 항목은 게시했든 건너뛰었든 버퍼에서 지운다</text></svg>
