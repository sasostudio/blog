<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="The devlog pipeline: over-draft, a human picks, and nothing ships until an audit that assumes a leak passes"><title>The devlog pipeline: over-draft, a human picks, and nothing ships until an audit that assumes a leak passes</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><rect x="24" y="40" width="150" height="66" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="99" y="66.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">Worklog buffer</text><text x="99" y="84.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">monthly · 2–3 lines</text><rect x="204" y="40" width="150" height="66" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="279" y="66.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">Menu table</text><text x="279" y="84.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">depth · sensitivity</text><rect x="384" y="40" width="110" height="66" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="439" y="66.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">Assemble</text><text x="439" y="84.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">draft</text><rect x="524" y="32" width="172" height="82" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="610" y="56.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">Independent audit</text><text x="610" y="73.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">assume a leak exists</text><text x="610" y="91.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">read-only</text><line x1="176" y1="73" x2="200" y2="73" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><line x1="356" y1="73" x2="380" y2="73" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="368" y="128.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="600" text-anchor="middle">only what I pick</text><line x1="496" y1="73" x2="520" y2="73" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><path d="M560 116 Q 560 148 480 148 Q 439 148 439 112" fill="none" stroke="#b7352c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-seal)"/><text x="400" y="168.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="600" text-anchor="middle">flags → main agent fixes → re-audit</text><line x1="640" y1="116" x2="640" y2="186" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="466" y="190" width="230" height="60" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="581" y="214.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">Audit result (PASS · flags)</text><text x="581" y="231.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="middle">shown to me as well</text><rect x="320" y="190" width="120" height="60" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="380" y="214.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">I say “ship it”</text><text x="380" y="231.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">→ published</text><line x1="464" y1="220" x2="444" y2="220" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><text x="24" y="282.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="500" text-anchor="start">Processed items leave the buffer, published or skipped</text></svg>
