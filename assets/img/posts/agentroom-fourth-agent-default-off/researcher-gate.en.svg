<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="How researcher joins: a narrow entrance, deep digging, a narrow exit"><title>How researcher joins: a narrow entrance, deep digging, a narrow exit</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="279" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="24" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#b7352c" font-weight="700" text-anchor="start">Narrow entrance — off by default</text><rect x="24" y="44" width="236" height="44" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="36" y="71.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="start">① The human explicitly asks</text><line x1="262" y1="66" x2="296" y2="120" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="24" y="98" width="236" height="44" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="36" y="125.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="start">② Impossible without outside info</text><line x1="262" y1="120" x2="296" y2="120" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="24" y="152" width="236" height="44" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="36" y="179.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="500" text-anchor="start">③ planner/dev asks → human gate</text><line x1="262" y1="174" x2="296" y2="120" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="24" y="228.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="start">✕ “Might be nice” is not a reason to spawn</text><text x="390" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#1e2430" font-weight="700" text-anchor="middle">Deep digging</text><rect x="300" y="44" width="180" height="152" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="390" y="76.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="15" fill="#1e2430" font-weight="700" text-anchor="middle">researcher</text><text x="390" y="108.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#49505e" font-weight="500" text-anchor="middle">isolated context</text><text x="390" y="128.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#49505e" font-weight="500" text-anchor="middle">unlimited search/reading</text><text x="390" y="148.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#49505e" font-weight="500" text-anchor="middle">raw pages stay here</text><text x="608" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#276843" font-weight="700" text-anchor="middle">Narrow exit</text><line x1="482" y1="120" x2="518" y2="120" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><rect x="522" y="80" width="174" height="84" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="609" y="106.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#276843" font-weight="700" text-anchor="middle">Returned to director</text><text x="609" y="130.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="500" text-anchor="middle">structured summary</text><text x="609" y="147.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="500" text-anchor="middle">+ source URLs only</text></svg>
