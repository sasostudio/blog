<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-label="기울기 측정: 같은 일을 N번과 4N번 해서 시간 차를 보면 고정비용이 상쇄된다"><title>기울기 측정: 같은 일을 N번과 4N번 해서 시간 차를 보면 고정비용이 상쇄된다</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="279" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><line x1="70" y1="220" x2="420" y2="220" stroke="#1e2430" stroke-width="1.3" marker-end="url(#a-ink)"/><line x1="70" y1="220" x2="70" y2="40" stroke="#1e2430" stroke-width="1.3" marker-end="url(#a-ink)"/><text x="426" y="224.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="500" text-anchor="start">그리기 횟수</text><text x="76" y="44.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="500" text-anchor="start">걸린 시간</text><line x1="70" y1="160" x2="410" y2="160" stroke="#b3a78b" stroke-dasharray="3 3"/><text x="76" y="176.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11" fill="#6b655a" font-weight="500" text-anchor="start">고정비용(측정 자체의 비용)</text><line x1="70" y1="160" x2="380" y2="50" stroke="#b7352c" stroke-width="2"/><line x1="70" y1="160" x2="380" y2="142" stroke="#276843" stroke-width="2"/><text x="386" y="52.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#b7352c" font-weight="700" text-anchor="start">비가속</text><text x="386" y="146.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="700" text-anchor="start">GPU 가속</text><line x1="140" y1="220" x2="140" y2="226" stroke="#1e2430"/><line x1="380" y1="220" x2="380" y2="226" stroke="#1e2430"/><text x="140" y="240.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="12" fill="#1e2430" font-weight="700" text-anchor="middle">N</text><text x="380" y="240.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="12" fill="#1e2430" font-weight="700" text-anchor="middle">4N</text><rect x="470" y="50" width="226" height="52" rx="6" fill="#ebe4d1" stroke="#b3a78b" stroke-width="1.2"/><text x="583" y="82.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="16" fill="#1e2430" font-weight="700" text-anchor="middle">t(4N) − t(N)</text><text x="483" y="128.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="600" text-anchor="start">검증값 (ns/px)</text><text x="483" y="150.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="13" fill="#276843" font-weight="700" text-anchor="start">GPU 0.01~0.02</text><text x="483" y="172.0" font-family='ui-monospace, "SF Mono", Consolas, "D2Coding", monospace' font-size="13" fill="#b7352c" font-weight="700" text-anchor="start">비가속 0.11~0.13</text><text x="360" y="264.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="500" text-anchor="middle">절대값 측정 시 GPU→CPU 회수 비용이 가속 쪽에만 붙어 신호가 역전</text></svg>
