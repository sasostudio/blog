<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="2D canvas acceleration states: unaccelerated right after creation or resize, and never promoted after an ad"><title>2D canvas acceleration states: unaccelerated right after creation or resize, and never promoted after an ad</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="70" y="120.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#6b655a" font-weight="600" text-anchor="middle">create · resize</text><line x1="70" y1="128" x2="112" y2="128" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><rect x="116" y="92" width="170" height="72" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="201" y="120.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#b7352c" font-weight="700" text-anchor="middle">Unaccelerated</text><text x="201" y="139.6" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="13.5" fill="#b7352c" font-weight="700" text-anchor="middle">3–4× cost per pixel</text><rect x="470" y="92" width="170" height="72" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="555" y="134.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#276843" font-weight="700" text-anchor="middle">GPU-accelerated</text><line x1="288" y1="118" x2="466" y2="118" stroke="#276843" stroke-width="1.6" marker-end="url(#a-live)"/><text x="377" y="88.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">attached to the DOM</text><text x="377" y="104.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">and drawn → promoted</text><path d="M520 92 C 500 40, 610 40, 590 92" fill="none" stroke="#276843" stroke-width="1.5" marker-end="url(#a-live)"/><text x="555" y="36.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12" fill="#276843" font-weight="600" text-anchor="middle">survives ads</text><line x1="466" y1="150" x2="290" y2="150" stroke="#1e2430" stroke-width="1.6" marker-end="url(#a-ink)"/><text x="377" y="170.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#1e2430" font-weight="600" text-anchor="middle">assigning canvas.width</text><text x="377" y="185.5" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#1e2430" font-weight="600" text-anchor="middle">(reallocates even if unchanged)</text><path d="M555 166 C 555 250, 201 250, 201 168" fill="none" stroke="#6b655a" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a-faint)"/><text x="378" y="250.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#6b655a" font-weight="600" text-anchor="middle">left idle → reclaimed</text><rect x="116" y="252" width="170" height="40" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-dasharray="4 3"/><line x1="201" y1="166" x2="201" y2="250" stroke="#b7352c" stroke-width="1.6" marker-end="url(#a-seal)"/><text x="201" y="268.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="700" text-anchor="middle">after a full-screen ad</text><text x="201" y="282.9" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="11.5" fill="#b7352c" font-weight="700" text-anchor="middle">→ promotion never happens</text></svg>
