<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 186" width="720" height="186" role="img" aria-label="Rollback cost is decided at the start: bake to a new name instead of overwriting, and undoing is a file move"><title>Rollback cost is decided at the start: bake to a new name instead of overwriting, and undoing is a file move</title><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e2430"/></marker><marker id="a-seal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7352c"/></marker><marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#276843"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b655a"/></marker></defs><rect x="0.5" y="0.5" width="719" height="185" rx="8" fill="#faf6ec" stroke="#d9d0bb"/><text x="180" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#b7352c" font-weight="700" text-anchor="middle">Overwrite the original</text><rect x="40" y="46" width="120" height="44" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="100" y="73.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">original assets</text><line x1="162" y1="68" x2="198" y2="68" stroke="#b7352c" stroke-width="1.6" marker-end="url(#a-seal)"/><rect x="202" y="46" width="120" height="44" rx="6" fill="#f6e4dc" stroke="#b7352c" stroke-width="1.5"/><text x="262" y="73.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">improved</text><line x1="44" y1="50" x2="156" y2="86" stroke="#b7352c" stroke-width="1.6"/><text x="180" y="134.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">Undoing means</text><text x="180" y="152.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#b7352c" font-weight="600" text-anchor="middle">rebuilding the original</text><line x1="360" y1="20" x2="360" y2="168" stroke="#d9d0bb" stroke-width="1.2"/><text x="540" y="30.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="14" fill="#276843" font-weight="700" text-anchor="middle">Bake to a new name</text><rect x="400" y="46" width="120" height="44" rx="6" fill="#faf6ec" stroke="#b3a78b" stroke-width="1.2"/><text x="460" y="73.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#1e2430" font-weight="600" text-anchor="middle">original assets</text><rect x="560" y="46" width="120" height="44" rx="6" fill="#e3eee5" stroke="#276843" stroke-width="1.5"/><text x="620" y="73.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">improved</text><text x="540" y="126.0" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">restore outputs + quarantine new files</text><text x="540" y="144.1" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">→ regenerated files verified</text><text x="540" y="162.2" font-family='Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif' font-size="12.5" fill="#276843" font-weight="600" text-anchor="middle">    byte-for-byte against backup</text></svg>
