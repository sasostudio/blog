# chpark03.github.io는 sasostudio.dev로 이사(08-03 vercel.app → 10-14 sasostudio.dev) — 이 워크플로는 리다이렉트 스텁만 배포한다.
# 본 사이트 배포는 Vercel(프로젝트 saso-studio, main push 시 자동 빌드)이 담당한다.
name: Deploy redirect stubs to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect stubs
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirects
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
