<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="theme-color" content="#f4efe3">
  {%- seo -%}
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">

  <a class="skip" href="#main">본문으로 이동</a>

  <main id="main">{{ content }}</main>

  <footer class="site"><div class="wrap"><div class="row">
    <span>© 2026 Saso Studio — 계속 기록 중인 장부</span>
    <span><a href="mailto:sasostudio.dev@gmail.com">sasostudio.dev@gmail.com</a> · <a href="https://github.com/sasostudio">GitHub</a></span>
